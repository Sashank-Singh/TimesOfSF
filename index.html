<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Times of San Francisco | SF news &amp; analysis</title>
    <meta
      name="description"
      content="San Francisco news and analysis: civics, culture, tech, transit, food, funding, and events—grounded in linked primary sources with editorial context."
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="author" content="Times of San Francisco" />
    <meta name="geo.region" content="US-CA" />
    <meta name="geo.placename" content="San Francisco" />
    <meta name="ICBM" content="37.7749, -122.4194" />
    <meta name="theme-color" content="#121212" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="alternate" type="application/rss+xml" title="Times of SF RSS" href="/feed.xml" />
    <link rel="alternate" type="text/plain" title="llms.txt" href="/llms.txt" />
    <meta name="ai-content" content="index, quote-with-attribution" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "NewsMediaOrganization",
            "@id": "https://www.timesofsf.com/#organization",
            "name": "Times of San Francisco",
            "alternateName": "Times of SF",
            "url": "https://www.timesofsf.com/",
            "logo": { "@type": "ImageObject", "url": "https://www.timesofsf.com/favicon.svg", "width": 64, "height": 64 },
            "image": "https://www.timesofsf.com/default-og.svg",
            "foundingDate": "2026",
            "areaServed": "San Francisco Bay Area"
          },
          {
            "@type": "WebSite",
            "@id": "https://www.timesofsf.com/#website",
            "url": "https://www.timesofsf.com/",
            "name": "Times of San Francisco",
            "inLanguage": "en-US",
            "publisher": { "@id": "https://www.timesofsf.com/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": { "@type": "EntryPoint", "urlTemplate": "https://www.timesofsf.com/?q={search_term_string}" },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
